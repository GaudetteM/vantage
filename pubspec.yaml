name: vantage
description: "A perspective-shift puzzle maze game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Animations
  flutter_animate: ^4.5.0

  # Persistent storage (level progress, settings)
  shared_preferences: ^2.3.2

  # One-time full-game unlock
  in_app_purchase: ^3.2.3

  # Audio
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  # Main icon — dark navy background, opaque, 1024×1024 px
  image_path: "assets/images/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Adaptive icon for Android 8+
  adaptive_icon_background: "#0D0D1A"   # VantageTheme.background
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  # Web
  web:
    generate: true
    image_path: "assets/images/icon.png"
  # macOS / Windows (desktop builds)
  macos:
    generate: true
    image_path: "assets/images/icon.png"
  windows:
    generate: true
    image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/levels/
    - assets/audio/
    - assets/images/
